name: Benchmark Build

on:
  push:
    paths:
      - '**.cpp'
      - '**.hpp'
      - '.github/workflows/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y g++

      - name: Compile all benchmarks
        run: |
          g++ -O3 -march=native -std=c++20 be.cpp -Iinclude -o BE
          g++ -O3 -march=native -std=c++20 le.cpp -Iinclude -o LE

      - name: Running BE
        run: ./BE

      - name: Running LE
        run: ./LE